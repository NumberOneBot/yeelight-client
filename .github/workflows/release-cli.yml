name: Release CLI

on:
  push:
    tags:
      - 'v*'
      - 'yeelight-cli@*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: dist/ylc.exe
            asset: ylc.exe
          - os: macos-latest
            script: build:mac-arm64
            artifact: dist/ylc
            asset: ylc-macos-arm64
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: dist/ylc-linux-x64
            asset: ylc-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        run: bun install

      - name: Build library
        run: pnpm build

      - name: Build binary
        run: pnpm --filter yeelight-cli ${{ matrix.script }}

      - name: Rename binary to release asset name
        shell: bash
        run: |
          src="packages/cli/${{ matrix.artifact }}"
          dst="packages/cli/dist/${{ matrix.asset }}"
          [ "$src" = "$dst" ] || mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/cli/dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
